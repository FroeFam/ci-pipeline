name: apply-skip-release-label
description: Add the skip-release label to a PR.
inputs:
  pr-number:
    description: Pull request number.
    required: true
  github-token:
    description: Token with pull-requests and issues write.
    required: true
runs:
  using: composite
  steps:
    - name: Apply skip-release label
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: '& "${{ github.action_path }}/apply-skip-release-label.ps1"'
