name: check-nonshipping-update
description: Decide whether a Dependabot PR changes nothing that ships (only test, docs or automation files, or only test and development packages), so its release can be deferred with skip-release. Output skip is true or false; the caller applies the label.
inputs:
  pr-number:
    description: Pull request number.
    required: true
  github-token:
    description: Token with pull-requests read.
    required: true
  dependencies-json:
    description: updated-dependencies-json output of dependabot/fetch-metadata. Empty means decide from the changed files only.
    required: false
    default: ''
outputs:
  skip:
    description: true when the PR ships nothing, otherwise false.
    value: ${{ steps.check.outputs.skip }}
runs:
  using: composite
  steps:
    - name: Check whether the update ships
      id: check
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number }}
        DEPENDENCIES_JSON: ${{ inputs.dependencies-json }}
      run: '& "${{ github.action_path }}/check-nonshipping-update.ps1"'
