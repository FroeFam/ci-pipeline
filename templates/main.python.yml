name: Main Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build:
    uses: FroeFam/ci-pipeline/.github/workflows/build-test.yml@v1
    with:
      language: python
      python-version: '{{PythonVersion}}'
      python-matrix: '{{PythonMatrix}}'
      integration-test-platforms: '{{IntegrationPlatforms}}'
      package-manager: {{PackageManagerInput}}
      lint-command: '{{LintCommand}}'
      format-command: '{{FormatCommand}}'
      typecheck-command: '{{TypecheckCommand}}'
    secrets: inherit

  release:
    needs: build
    uses: FroeFam/ci-pipeline/.github/workflows/release.yml@v1
    with:
      registry: {{Registry}}
      image-namespace: {{ImageNamespace}}
      initial-version: {{InitialVersion}}
      images: '{{Images}}'
    secrets: inherit
