name: Label gate (reusable)

# No job-level if: filter: a skipped job reports green and would let a PR
# without a semver label merge. The one deliberate exception is in the script:
# labeled/unlabeled events for labels the gate does not read pass without
# evaluating (see the comment there).

on:
  workflow_call:

# No top-level permissions: the Label Gate caller grants only pull-requests
# read and checks write, and a called workflow may not request more.
permissions: {}

jobs:
  evaluate:
    name: evaluate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      checks: write
    steps:
      - name: Check semver label
        uses: actions/github-script@v9
        with:
          script: |
            const semverLabels = ['semver: major', 'semver: minor', 'semver: patch'];

            // Dependabot (and gh pr create --label) add labels at PR creation,
            // before Classify PR applies the semver label. Evaluating those
            // events records a failing label-gate check in its own check suite,
            // and the later workflow_run pass cannot clear it. Only labels the
            // gate reads are evaluated here; the Classify PR workflow_run
            // evaluates every new PR.
            if (context.eventName === 'pull_request' &&
                ['labeled', 'unlabeled'].includes(context.payload.action)) {
              const changed = context.payload.label?.name ?? '';
              if (!changed.startsWith('semver:') && changed !== 'skip-release') {
                core.info(`Label '${changed}' does not affect the gate. Skipping.`);
                return;
              }
            }

            let prNumber;
            let headSha;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;

              // For same-repo PRs, pull_requests is populated by GitHub.
              // Use pull_requests[0].head.sha, not run.head_sha: Classify PR
              // uses pull_request_target, so run.head_sha is the base SHA.
              if (run.pull_requests && run.pull_requests.length > 0) {
                prNumber = run.pull_requests[0].number;
                headSha = run.pull_requests[0].head.sha;
              } else {
                // Fork PRs: match by branch name + source repo instead.
                const prs = await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                });
                const pr = prs.find(p =>
                  p.head.ref === run.head_branch &&
                  p.head.repo.full_name === run.head_repository.full_name
                );
                if (!pr) {
                  core.info(`No open PR found for branch ${run.head_branch}. Skipping.`);
                  return;
                }
                prNumber = pr.number;
                headSha = pr.head.sha;
              }
            } else {
              prNumber = context.issue.number;
            }

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const allLabelNames = labels.map(l => l.name);
            const hasSkipRelease = allLabelNames.includes('skip-release');
            const semverFound = semverLabels.filter(l => allLabelNames.includes(l));

            let passed = false;
            let message;

            if (semverFound.length > 1) {
              message = `PR has multiple semver labels (${semverFound.join(', ')}). Remove all but one.`;
            } else if (semverFound.length === 0) {
              message = 'PR must have exactly one semver label: semver: major, semver: minor, or semver: patch. skip-release may be added alongside but does not replace a semver label.';
            } else {
              const active = [...semverFound, ...(hasSkipRelease ? ['+ skip-release'] : [])];
              message = `PR labels OK: ${active.join(' ')}`;
              passed = true;
            }

            if (context.eventName === 'workflow_run') {
              // workflow_run jobs run in default-branch context, so the automatic
              // check would land on the wrong commit. Create one on the PR head.
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'label-gate',
                head_sha: headSha,
                status: 'completed',
                conclusion: passed ? 'success' : 'failure',
                output: {
                  title: passed ? 'Semver label OK' : 'Missing or invalid semver label',
                  summary: message,
                },
              });
            }

            if (passed) {
              core.info(message);
            } else {
              core.setFailed(message);
            }
