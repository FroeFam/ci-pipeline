name: actionlint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
