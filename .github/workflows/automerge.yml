name: Dependabot auto-merge (reusable)

on:
  workflow_call:
    inputs:
      automerge-client-id:
        description: Client id of the froefam-automerge GitHub App (caller passes vars.AUTOMERGE_APP_CLIENT_ID).
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  automerge:
    name: Enable auto-merge for eligible Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Both the PR author and the run actor must be Dependabot. A human-actor run
    # reads the Actions secret store, where AUTOMERGE_APP_PRIVATE_KEY (a
    # Dependabot secret) is absent, so the token step would fail. Skip instead.
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Enable auto-merge as the froefam-automerge GitHub App, not GITHUB_TOKEN:
      # a merge pushed by GITHUB_TOKEN does not trigger the main pipeline.
      - name: Generate app token
        id: app-token
        if: ${{ steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.automerge-client-id }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        if: ${{ steps.app-token.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$env:PR_URL"

      - name: Explain failure
        if: ${{ failure() }}
        shell: pwsh
        run: |
          @(
            '### Dependabot auto-merge did not complete'
            ''
            'A step in this job failed, so auto-merge was not enabled; the PR can still be'
            'merged manually. If the failure is in **Generate app token**, check that the'
            '`AUTOMERGE_APP_PRIVATE_KEY` Dependabot secret is valid and the `froefam-automerge`'
            'GitHub App is still installed on this repository with Contents and Pull requests'
            'write access.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY
